# Fixed startup chooser. The selected FIT configuration is verified against a
# required public key in the U-Boot control FDT before any payload is handed off.
CONFIG_AUTOBOOT=y
CONFIG_BOOTDELAY=-2
CONFIG_AUTOBOOT_MENU_SHOW=y
CONFIG_BOOTMENU_DISABLE_UBOOT_CONSOLE=y
CONFIG_CMD_BOOTMENU=y
CONFIG_USE_DEFAULT_ENV_FILE=y
CONFIG_DEFAULT_ENV_FILE="board/xilinx/zynqmp/msu2-selector.env"
CONFIG_ENV_IS_NOWHERE=y
# A fixed menu must not fall through to standard boot discovery or a stored env.
# CONFIG_DISTRO_DEFAULTS is not set
# CONFIG_ENV_IS_IN_FAT is not set
# CONFIG_ENV_IS_IN_MMC is not set
# CONFIG_ENV_IS_IN_EXT4 is not set
# CONFIG_ENV_IS_IN_EEPROM is not set
# CONFIG_ENV_IS_IN_FLASH is not set
# CONFIG_ENV_IS_IN_NVRAM is not set
# CONFIG_ENV_IS_IN_NAND is not set
# CONFIG_ENV_IS_IN_ONENAND is not set
# CONFIG_ENV_IS_IN_REMOTE is not set
# CONFIG_ENV_IS_IN_SPI_FLASH is not set
# CONFIG_ENV_IS_IN_UBI is not set
CONFIG_FIT=y
CONFIG_FIT_SIGNATURE=y
CONFIG_RSA=y
# CONFIG_LEGACY_IMAGE_FORMAT is not set
