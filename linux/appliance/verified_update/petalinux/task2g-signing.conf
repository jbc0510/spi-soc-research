# Development-only FIT signing configuration for this Task 2g prototype.
# The Yocto classes generate this disposable key under build/conf. Do not use
# it for a production device or commit its private-key files.
UBOOT_SIGN_ENABLE = "1"
UBOOT_SIGN_KEYDIR = "${TOPDIR}/conf/msu2-dev-signing"
UBOOT_SIGN_KEYNAME = "msu2-test"
UBOOT_MKIMAGE_DTCOPTS = "-I dts -O dtb -p 0x4000"
FIT_GENERATE_KEYS = "1"
FIT_SIGN_INDIVIDUAL = "0"
