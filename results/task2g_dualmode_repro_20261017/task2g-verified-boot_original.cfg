# PetaLinux/Yocto U-Boot fragment for the signed FIT prototype.
# Storage backend and board-specific MMC selection remain inherited from the
# ZynqMP defconfig and must be checked in the generated final .config.
CONFIG_FIT=y
CONFIG_FIT_SIGNATURE=y
CONFIG_FIT_SIGNATURE_MAX_SIZE=0x10000000
CONFIG_RSA=y
CONFIG_BOOTCOUNT_LIMIT=y
CONFIG_BOOTCOUNT_ENV=y
# A required control-FDT signing key makes every selected configuration
# signature mandatory. Keep legacy image format disabled for fail-closed boot.
# CONFIG_LEGACY_IMAGE_FORMAT is not set
